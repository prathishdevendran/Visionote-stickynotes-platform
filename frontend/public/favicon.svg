<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Main glowing circle -->
  <circle cx="16" cy="16" r="14" fill="url(#grad)" filter="url(#shadow)" />
  <!-- Inner ring -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
  <!-- Minimalist 'V' lettermark -->
  <path d="M11 11.5 L14.8 20.5 C15.2 21.2 16.8 21.2 17.2 20.5 L21 11.5" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
